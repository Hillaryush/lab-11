<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex;
           justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 32px; border-radius: 10px; width: 320px;
            box-shadow: 0 4px 16px rgba(0,0,0,.1); }
    h2 { margin-top: 0; text-align: center; }
    input { width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 10px; background: #2563eb; color: #fff;
             border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
    .error { color: #b91c1c; background: #fee2e2; padding: 8px; border-radius: 6px;
             margin-bottom: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>User Login</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Login name</label>
      <input type="text" name="username" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
